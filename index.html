<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>申请白名单 · Kypo MC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1424'/%3E%3Ccircle cx='32' cy='30' r='16' fill='%23f6d789'/%3E%3Ccircle cx='38' cy='24' r='15' fill='%230f1424'/%3E%3C/svg%3E">
<style>
  :root{ --text:#e8edff; --dim:#8b99bd; --green:#3dfc6e; --cyan:#2ee6c8; --pink:#ff4db8 }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(120% 90% at 50% -10%,#1b2447,#0b1020 60%,#070a14);
    color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .card{
    width:100%;max-width:380px;padding:34px 30px;border-radius:20px;text-align:center;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    border:1px solid #243055;backdrop-filter:blur(8px);
  }
  h1{
    font-size:26px;margin:0 0 6px;letter-spacing:.08em;
    background:linear-gradient(90deg,var(--green),var(--cyan) 45%,#4aa8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p.sub{color:var(--dim);font-size:13.5px;margin:0 0 26px}
  input{
    width:100%;padding:13px 15px;border-radius:11px;border:1px solid #2b3862;
    background:rgba(255,255,255,.04);color:var(--text);font-size:16px;outline:none;
  }
  input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(46,230,200,.14)}
  button{
    width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;cursor:pointer;
    font-size:16px;font-weight:700;color:#052312;
    background:linear-gradient(90deg,var(--green),var(--cyan));
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  .hint{color:var(--dim);font-size:12.5px;margin-top:16px;line-height:1.75}
  .err{color:var(--pink);font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <h1>申请白名单</h1>
  <p class="sub">Kypo MC · 26.3 · mc.kypo.cn</p>

  <input id="name" type="text" placeholder="LittleSkin 角色名" autocomplete="off" spellcheck="false" maxlength="16">
  <button id="go" disabled>提交</button>
  <div class="err" id="err"></div>

  <div class="hint">
    填你在 <b>littleskin.cn</b> 创建的角色名。<br>
    点提交会跳到 GitHub，再点一次 <b>Submit new issue</b> 就好，几分钟内自动通过。
  </div>
</div>

<script>
  // 换成你的仓库：owner/repo
  var REPO = "REPLACE_ME";

  var input = document.getElementById("name");
  var btn = document.getElementById("go");
  var err = document.getElementById("err");

  function valid(v) { return /^[A-Za-z0-9_]{3,16}$/.test(v); }

  input.addEventListener("input", function () {
    var v = input.value.trim();
    btn.disabled = !valid(v);
    err.textContent = v && !valid(v) ? "只能用 3–16 位字母、数字、下划线" : "";
  });

  btn.addEventListener("click", function () {
    var name = input.value.trim();
    if (!valid(name)) return;
    if (REPO === "REPLACE_ME") {
      err.textContent = "申请入口还没配置，先找服主吧";
      return;
    }
    var url = "https://github.com/" + REPO + "/issues/new"
      + "?template=whitelist.yml"
      + "&title=" + encodeURIComponent("[白名单] " + name)
      + "&body=" + encodeURIComponent("角色名: " + name);
    location.href = url;
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !btn.disabled) btn.click();
  });
</script>
</body>
</html>
